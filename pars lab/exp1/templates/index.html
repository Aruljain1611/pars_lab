<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dataset Citation Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0f0f0;
            border-left: 5px solid #333;
        }

        .citation {
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Dataset Citation Generator</h1>

    <form method="POST">

        <label for="dataset">
            Select Dataset:
        </label>

        <select name="dataset" id="dataset" required>

            <option value="">-- Select Dataset --</option>

            <option value="mimic"
                {% if selected_dataset == "mimic" %}selected{% endif %}>
                MIMIC-IV Dataset
            </option>

            <option value="california"
                {% if selected_dataset == "california" %}selected{% endif %}>
                California Housing Dataset
            </option>

        </select>

        <button type="submit">
            Generate Citation
        </button>

    </form>

    {% if citation %}

    <div class="result">
        <h2>Generated Citation</h2>

        <p class="citation">
            {{ citation }}
        </p>
    </div>

    {% endif %}

</div>

</body>

</html>
